services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexushr}
      POSTGRES_USER: ${POSTGRES_USER:-nexushr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - nexushr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexushr} -d ${POSTGRES_DB:-nexushr}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nexushr}
      DB_USERNAME: ${POSTGRES_USER:-nexushr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Admin}
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  nexushr_pg:
