# Production profile: PostgreSQL only. All credentials are supplied by the host.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Restrict browser access to the exact Vercel production origin(s).
app.cors.allowed-origins=${CORS_ORIGINS}

# Never use a development/default JWT key in production.
nexushr.jwt.secret=${JWT_SECRET}
nexushr.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Disable public API schema/docs in production unless deliberately re-enabled.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
