spring.application.name=nexushr-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nexushr;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.format_sql=true
nexushr.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes-long}
nexushr.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jackson.serialization.fail-on-empty-beans=false

spring.flyway.enabled=false
