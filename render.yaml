databases:
  - name: nexushr-postgres
    databaseName: nexushr
    user: nexushr_app
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: nexushr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nexushr-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexushr-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexushr-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexushr-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexushr-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: NexusHR Platform Admin
